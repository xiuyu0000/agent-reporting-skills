name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: "24.19.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile skills/deliver-dual-audience-report/scripts/*.py
      - name: Install specification validators
        run: python -m pip install check-jsonschema==0.36.2 "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate Agent Skill and report contract schema
        run: |
          skills-ref validate skills/deliver-dual-audience-report
          check-jsonschema --check-metaschema skills/deliver-dual-audience-report/references/report-contract.schema.json
      - name: Unit and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Install locked Node dependencies
        run: npm ci
      - name: Validate Node bootstrap
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          npm run build -- --infrastructure-only
          npm run typecheck
          npm run lint
          npm run test:browser -- --list
