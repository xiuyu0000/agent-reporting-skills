name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: "24.19.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install specification validators
        run: python -m pip install check-jsonschema==0.36.2 "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate retained Python baseline
        run: |
          if compgen -G 'skills/deliver-dual-audience-report/scripts/*.py' > /dev/null; then
            python -m py_compile skills/deliver-dual-audience-report/scripts/*.py
          fi
          skills-ref validate skills/deliver-dual-audience-report
          if test -f skills/deliver-dual-audience-report/references/report-contract.schema.json; then
            check-jsonschema --check-metaschema skills/deliver-dual-audience-report/references/report-contract.schema.json
          fi
          if test -f tests/test_delivery.py; then
            python -m unittest discover -s tests -p 'test_delivery.py' -v
          fi
      - name: Install locked Node dependencies
        run: npm ci
      - name: Validate Node bootstrap
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
          npm run build -- --infrastructure-only
          npm run typecheck
          npm run lint
      - name: Validate implemented schemas
        run: |
          if test -f skills/deliver-dual-audience-report/references/review-document.schema.json; then
            npm run schema:meta
            npm run schema:types
            npm run check:generated
          fi
      - name: Run implemented Node suites
        run: |
          if find tests/unit -type f -name '*.test.ts' -print -quit 2>/dev/null | grep -q .; then
            npm run test:unit
          fi
          if find tests/e2e -type f -name '*.test.ts' -print -quit 2>/dev/null | grep -q .; then
            npm run test:e2e
          fi
          if find src -type f -name '*.ts' -print -quit 2>/dev/null | grep -q .; then
            npm run test:coverage
          fi
          if test -f tests/acceptance/coverage-map.json; then
            npm run check:acceptance-coverage
          else
            node tools/check-acceptance-coverage.mjs --self-test
          fi
      - name: Validate implemented browser suites
        run: |
          if find tests/browser -type f \( -name '*.spec.ts' -o -name '*.test.ts' \) ! -name 'bootstrap.spec.ts' -print -quit | grep -q .; then
            npx playwright install --with-deps chromium webkit firefox
            npm run test:browser
          else
            npm run test:browser -- --list
          fi
      - name: Validate implemented product build
        run: |
          if test -f src/cli/main.ts && test -f src/workbench/main.ts; then
            npm run build
          fi
